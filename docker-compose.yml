version: '3.8'

services:
  reserva-medica-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reserva_medica_app
    ports:
      - "${PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=${APP_NAME:-ReservaHorasMedicas}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
