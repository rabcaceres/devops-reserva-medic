name: DevOps CI Pipeline - Reserva de Horas Médicas

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-structure:
    name: Validar Estructura y Archivos Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Verificar archivos clave del proyecto
        run: |
          test -f Dockerfile || (echo "Falta Dockerfile" && exit 1)
          test -f docker-compose.yml || (echo "Falta docker-compose.yml" && exit 1)
          test -f src/index.html || (echo "Falta src/index.html" && exit 1)
          test -f src/styles.css || (echo "Falta src/styles.css" && exit 1)
          echo "✅ Estructura del proyecto verificada con éxito."

  build-docker-image:
    name: Construir y Probar Contenedor
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: reserva-medica:test
